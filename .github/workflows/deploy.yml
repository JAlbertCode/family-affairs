name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves the site from /<repo>/, so assets need that prefix.
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional. Unset secrets arrive as empty strings and the app falls
          # back to the public broker and STUN-only, which is exactly the
          # behaviour before these lines existed. Add the TURN ones under
          # Settings -> Secrets and variables -> Actions when players start
          # reporting that they cannot connect.
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          VITE_STUN_URLS: ${{ secrets.VITE_STUN_URLS }}
          VITE_PEER_HOST: ${{ secrets.VITE_PEER_HOST }}
          VITE_PEER_PORT: ${{ secrets.VITE_PEER_PORT }}
          VITE_PEER_PATH: ${{ secrets.VITE_PEER_PATH }}
          VITE_PEER_SECURE: ${{ secrets.VITE_PEER_SECURE }}
      - uses: actions/configure-pages@v5
        with:
          # turns Pages on for the repo automatically on first run
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
